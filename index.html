<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login</title>

    <link rel="icon" href="/static/images/autismo-96.png" type="image/x-icon" />

    <link rel="stylesheet" href="/static/css/login.css" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:200,300,400,500,600,700,800,900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v6.5.1/css/all.css"
    />

    <script src="/static/js/login.js" defer></script>
  </head>
  <body>
    <div class="box">
      <div class="login">
        <div class="loginBx">
          <h2>
            <i class="fa-solid fa-right-to-bracket"></i>
            Login
            <i class="fa-solid fa-heart"></i>
            <br /><br />
          </h2>
          <form id="login-form">
            <fieldset>
              <div>
                <input
                  type="text"
                  id="login"
                  name="login"
                  placeholder="Login"
                />
                <br /><br />
              </div>
              <div>
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Senha"
                />
                <br /><br />
              </div>
              <input type="submit" value="Sign In" />
              <br /><br />
              <div class="group">
                <a href="#">Esqueci a senha!</a>
                <a href="#" id="abrir-cadastro">Cadastrar</a>
              </div>
            </fieldset>
          </form>
          <form id="cadastro-form" style="display: none; margin-top: 18px;">
            <h3 style="color: #fff; margin-bottom: 12px;">Criar conta</h3>
            <fieldset>
              <input type="text" id="cadastro-nome" placeholder="Nome completo" required />
              <br /><br />
              <input type="text" id="cadastro-login" placeholder="Escolha um login" required />
              <br /><br />
              <input type="password" id="cadastro-senha" placeholder="Senha (mínimo 4 caracteres)" minlength="4" required />
              <br /><br />
              <input type="submit" value="Cadastrar" />
              <br /><br />
              <div class="group"><a href="#" id="voltar-login">Voltar para o login</a></div>
            </fieldset>
          </form>
        </div>
      </div>
    </div>
    <div class="message">
      <div id="erro-login" style="display: none; color: red">
        Usuário ou senha inválidos.
      </div>
      <div id="logout-ok" style="display: none; color: green">
        Logout realizado com sucesso.
      </div>
      <div id="mensagem-cadastro" style="display: none; color: #45f3ff; text-align: center;"></div>
    </div>
  </body>
</html>
