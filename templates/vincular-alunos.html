<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vincular alunos às turmas</title><link rel="stylesheet" href="/static/css/form.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"><link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.1/css/all.css"><script src="/static/js/auth.js" defer></script><script src="/static/js/vincular-alunos.js" defer></script></head>
<body><header><div class="header-container"><h1>Vincular alunos às turmas</h1><div class="buttons"><button id="btn-home"><i class="fa-solid fa-house"></i> Home</button><button id="btn-backward"><i class="fa-solid fa-arrow-left"></i> Voltar</button><button id="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Sair</button></div></div></header>
<main><div class="form-container"><h2>Novo vínculo</h2><form id="form-vinculo"><div class="input-group"><label for="classId">Turma</label><select id="classId" required><option value="">Carregando turmas...</option></select></div><div class="input-group"><label for="studentId">Aluno</label><select id="studentId" required><option value="">Selecione</option></select></div><button type="submit" class="btn-enviar">Vincular aluno</button></form><p id="mensagem-retorno" class="mensagem"></p><h2>Vínculos existentes</h2><div style="overflow-x:auto"><table style="width:100%"><thead><tr><th>Aluno</th><th>Turma</th><th>Período</th><th>Ação</th></tr></thead><tbody id="vinculos"></tbody></table></div></div></main></body></html>
