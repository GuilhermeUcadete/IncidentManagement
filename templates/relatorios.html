<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatórios de ocorrências</title><link rel="stylesheet" href="/static/css/list.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"><link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.1/css/all.css"><script src="/static/js/auth.js" defer></script><script src="/static/js/relatorios.js" defer></script></head><body><header><div class="header-container"><h1>Relatórios de ocorrências</h1><div class="buttons"><button id="btn-home">Home</button><button id="btn-backward">Voltar</button><button id="btn-logout">Sair</button></div></div></header><main><div class="table-container"><h2>Filtrar ocorrências</h2><div class="filtros-ocorrencias" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:15px 0"><label>Aluno<select id="student"><option value="">Todos</option></select></label><label>Turma<select id="class"><option value="">Todas</option></select></label><label>Categoria<select id="category"><option value="">Todas</option></select></label><label>Tipo<select id="type"><option value="">Todos</option></select></label><label>De<input type="date" id="from"></label><label>Até<input type="date" id="to"></label><button id="filter">Filtrar</button><button id="clear">Limpar</button><button id="csv">Exportar CSV</button><button id="print">Imprimir / salvar PDF</button></div><p id="message"></p><div style="overflow:auto"><table><thead><tr><th>ID</th><th>Data</th><th>Turma</th><th>Aluno</th><th>Categoria</th><th>Tipo</th><th>Descrição</th><th>Professor</th></tr></thead><tbody id="results"></tbody></table></div></div></main></body></html>
