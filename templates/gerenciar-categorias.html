<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerenciar categorias e tipos</title><link rel="stylesheet" href="/static/css/form.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"><link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.1/css/all.css"><script src="/static/js/auth.js" defer></script><script src="/static/js/gerenciar-categorias.js" defer></script></head><body><header><div class="header-container"><h1>Categorias e tipos de ocorrência</h1><div class="buttons"><button id="btn-home"><i class="fa-solid fa-house"></i> Home</button><button id="btn-backward">Voltar</button><button id="btn-logout">Sair</button></div></div></header><main><div class="form-container"><h2>Cadastrar categoria</h2><form id="form-categoria"><div class="input-group"><label for="category-name">Nome da categoria</label><input id="category-name" required maxlength="80"></div><button class="btn-enviar">Adicionar categoria</button></form><h2 style="margin-top:25px">Categorias cadastradas</h2><div style="overflow:auto"><table style="width:100%"><thead><tr><th>Categoria</th><th>Ação</th></tr></thead><tbody id="categories"></tbody></table></div><h2 style="margin-top:30px">Cadastrar tipo de ocorrência</h2><form id="form-tipo"><div class="input-group"><label for="type-name">Nome do tipo</label><input id="type-name" required maxlength="80"></div><div class="input-group"><label for="type-category">Categoria</label><select id="type-category" required></select></div><button class="btn-enviar">Adicionar tipo</button></form><h2 style="margin-top:25px">Tipos cadastrados</h2><div style="overflow:auto"><table style="width:100%"><thead><tr><th>Tipo</th><th>Categoria</th><th>Ação</th></tr></thead><tbody id="types"></tbody></table></div><p id="mensagem-retorno" class="mensagem"></p></div></main></body></html>
